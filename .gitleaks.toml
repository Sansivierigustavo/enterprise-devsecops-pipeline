  paths = [
    '''\.venv/''',
    '''venv/''',
    '''__pycache__/''',
    '''\.pytest_cache/''',
    '''htmlcov/''',
    '''reports/''',
    '''coverage\.xml''',
    '''\.coverage''',
    '''\.terraform/''',
    '''terraform\.tfstate''',
    '''terraform\.tfstate\.backup''',
    '''tfplan''',
  ]